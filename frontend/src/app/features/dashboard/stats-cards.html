@if (stats(); as s) {
  <div class="stats-cards">
    <div class="stats-card stats-card--doctors">
      <div class="stats-card__icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
        </svg>
      </div>
      <div class="stats-card__content">
        <span class="stats-card__value">{{ s.totalAvailableDoctors }}</span>
        <span class="stats-card__label">Available Doctors</span>
      </div>
    </div>

    <div class="stats-card stats-card--upcoming">
      <div class="stats-card__icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm-7-9H7v5h5v-5z"/>
        </svg>
      </div>
      <div class="stats-card__content">
        <span class="stats-card__value">{{ s.upcomingConsultations }}</span>
        <span class="stats-card__label">Upcoming Consultations</span>
      </div>
    </div>

    <div class="stats-card stats-card--completed">
      <div class="stats-card__icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
      </div>
      <div class="stats-card__content">
        <span class="stats-card__value">{{ s.completedConsultations }}</span>
        <span class="stats-card__label">Completed Consultations</span>
      </div>
    </div>
  </div>
}
