<section class="consultation-list">
  <div class="consultation-list__header">
    <div class="consultation-list__title-row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--primary)">
        <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm-7-9H7v5h5v-5z"/>
      </svg>
      <h2 class="consultation-list__title">My Consultations</h2>
    </div>
    <p class="consultation-list__subtitle">View your upcoming and past consultations.</p>
  </div>

  <div class="consultation-list__filters">
    <div class="consultation-list__search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="consultation-list__search-icon">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input
        type="text"
        class="consultation-list__search-input"
        placeholder="Search by doctor..."
        [ngModel]="searchTerm()"
        (ngModelChange)="onSearchChange($event)"
      />
    </div>
    <div class="consultation-list__filter-row">
      <div class="consultation-list__status-filters">
        @for (s of ['All', 'Scheduled', 'Completed', 'Cancelled']; track s) {
          <button
            class="consultation-list__filter-chip"
            [class.consultation-list__filter-chip--active]="statusFilter() === s"
            (click)="onStatusChange(s)"
          >
            {{ s }}
          </button>
        }
      </div>
      <button
        class="consultation-list__sort-btn"
        (click)="toggleSortOrder()"
        [attr.title]="sortOrder() === 'desc' ? 'Newest first' : 'Oldest first'"
      >
        @if (sortOrder() === 'desc') {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
          </svg>
          Newest
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6 1.41 1.41z"/>
          </svg>
          Oldest
        }
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="consultation-list__loading">
      <div class="consultation-list__spinner"></div>
      <p>Loading consultations...</p>
    </div>
  } @else {
    <div class="consultation-list__cards">
      @for (consultation of consultations(); track consultation.id) {
        <app-consultation-card
          [consultation]="consultation"
          (viewDetails)="onViewDetails($event)"
        />
      } @empty {
        <div class="consultation-list__empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="var(--gray-300)">
            <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/>
          </svg>
          <p>No consultations found.</p>
        </div>
      }
    </div>
  }
</section>
