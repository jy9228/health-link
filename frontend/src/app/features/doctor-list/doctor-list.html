<section class="doctor-list">
  <div class="doctor-list__header">
    <div class="doctor-list__title-row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--primary)">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
      <h2 class="doctor-list__title">Available Doctors</h2>
    </div>
    <p class="doctor-list__subtitle">Find the right doctor for your needs.</p>
  </div>

  <div class="doctor-list__filters">
    <div class="doctor-list__search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="doctor-list__search-icon">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input
        type="text"
        class="doctor-list__search-input"
        placeholder="Search by name or specialty..."
        [ngModel]="searchTerm()"
        (ngModelChange)="onSearchChange($event)"
      />
    </div>
    @if (specialties().length > 2) {
      <div class="doctor-list__specialty-filters">
        @for (spec of specialties(); track spec) {
          <button
            class="doctor-list__filter-chip"
            [class.doctor-list__filter-chip--active]="specialtyFilter() === spec"
            (click)="onSpecialtyChange(spec)"
          >
            {{ spec }}
          </button>
        }
      </div>
    }
  </div>

  @if (loading()) {
    <div class="doctor-list__loading">
      <div class="doctor-list__spinner"></div>
      <p>Loading doctors...</p>
    </div>
  } @else {
    <div class="doctor-list__cards">
      @for (doctor of doctors(); track doctor.id) {
        <app-doctor-card
          [doctor]="doctor"
          (bookConsultation)="onBookConsultation($event)"
        />
      } @empty {
        <p class="doctor-list__empty">No doctors found matching your search.</p>
      }
    </div>
  }
</section>
